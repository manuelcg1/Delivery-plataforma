spring:
  application:
    name: delivery-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery}
    username: ${DB_USERNAME:delivery}
    password: ${DB_PASSWORD:delivery_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:delivery_redis_password}
  jackson:
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${CATALOG_MAX_IMAGE_SIZE_MB:5}MB
      max-request-size: ${CATALOG_MAX_IMAGE_SIZE_MB:5}MB

identity:
  jwt-secret: ${JWT_SECRET:development-only-secret-key-change-me-32-bytes}
  access-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
  refresh-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  reset-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}

platform:
  owner:
    bootstrap-enabled: ${PLATFORM_OWNER_BOOTSTRAP_ENABLED:false}
    initial-password: ${PLATFORM_OWNER_INITIAL_PASSWORD:}
    email: ${PLATFORM_OWNER_EMAIL:}
    username: ${PLATFORM_OWNER_USERNAME:platform_owner}
merchant:
  courier-assignment-timeout-seconds: ${COURIER_ASSIGNMENT_TIMEOUT_SECONDS:900}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Delivery Platform
    version: 0.1.0

tracking:
  location-interval-seconds: ${TRACKING_LOCATION_INTERVAL_SECONDS:5}
  maximum-accuracy-meters: ${TRACKING_MAXIMUM_ACCURACY_METERS:100}
  maximum-speed-kph: ${TRACKING_MAXIMUM_SPEED_KPH:180}
  customer:
    stale-threshold: ${TRACKING_CUSTOMER_STALE_THRESHOLD:PT60S}
notifications:
  firebase-enabled: ${FIREBASE_ENABLED:false}
  firebase-project-id: ${FIREBASE_PROJECT_ID:cerka-delivery}
  firebase-service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
google:
  places:
    enabled: ${GOOGLE_PLACES_ENABLED:false}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    country: ${GOOGLE_PLACES_COUNTRY:PE}
    language: ${GOOGLE_PLACES_LANGUAGE:es}
