name: delivery-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery-network]

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-delivery_redis_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-delivery_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery-network]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: delivery-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delivery}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delivery_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery-network]

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: delivery-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [delivery-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-delivery}
      DB_USERNAME: ${POSTGRES_USER:-delivery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-delivery_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-delivery_redis_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-development-and-production}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delivery}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delivery_minio_password}
      MINIO_BUCKET_CATALOG: ${MINIO_BUCKET_CATALOG:-delivery-catalog}
      MINIO_BUCKET_PROOFS: ${MINIO_BUCKET_PROOFS:-delivery-proofs}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CATALOG_MAX_IMAGE_SIZE_MB: ${CATALOG_MAX_IMAGE_SIZE_MB:-5}
      PROOF_MAX_IMAGE_SIZE_MB: ${PROOF_MAX_IMAGE_SIZE_MB:-8}
      TRACKING_LOCATION_INTERVAL_SECONDS: ${TRACKING_LOCATION_INTERVAL_SECONDS:-5}
      TRACKING_MAXIMUM_ACCURACY_METERS: ${TRACKING_MAXIMUM_ACCURACY_METERS:-100}
      TRACKING_MAXIMUM_SPEED_KPH: ${TRACKING_MAXIMUM_SPEED_KPH:-180}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-300}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-simulated-secret}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-30}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-3}
      COURIER_ASSIGNMENT_TIMEOUT_SECONDS: ${COURIER_ASSIGNMENT_TIMEOUT_SECONDS:-900}
      DELIVERY_DEFAULT_BASE_FEE: ${DELIVERY_DEFAULT_BASE_FEE:-5.00}
      DELIVERY_DEFAULT_FEE_PER_KM: ${DELIVERY_DEFAULT_FEE_PER_KM:-0.00}
      DELIVERY_DEFAULT_ESTIMATED_MINUTES: ${DELIVERY_DEFAULT_ESTIMATED_MINUTES:-30}
      DELIVERY_DEFAULT_CURRENCY: ${DELIVERY_DEFAULT_CURRENCY:-PEN}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [delivery-network]

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: delivery-admin-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [delivery-network]

  merchant-portal:
    build:
      context: ./merchant-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
        API_INTERNAL_URL: http://backend:8080
    container_name: delivery-merchant-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
      API_INTERNAL_URL: http://backend:8080
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks: [delivery-network]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  delivery-network:
    driver: bridge
