name: delivery_customer
description: Aplicación móvil para clientes de Delivery Platform.
publish_to: none
version: 0.7.0+7
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
  stomp_dart_client: ^2.1.3
  geolocator: ^13.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/icono-cerka.png
    - assets/branding/cerka-login-hero-v2.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icono-cerka.png
  min_sdk_android: 21
