name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Didentity.migration.jdbcUrl=jdbc:postgresql://localhost:5432/postgres -Dmerchant.test.jdbcUrl=jdbc:postgresql://localhost:5432/postgres
        working-directory: backend
        env:
          IDENTITY_MIGRATION_DB_USER: delivery_test
          IDENTITY_MIGRATION_DB_PASSWORD: ci-only-postgres-password
          MERCHANT_TEST_DB_USER: delivery_test
          MERCHANT_TEST_DB_PASSWORD: ci-only-postgres-password

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
        working-directory: admin-web
      - run: npm run lint
        working-directory: admin-web
      - run: npm test
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web

  merchant-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: merchant-portal/package-lock.json
      - run: npm ci
        working-directory: merchant-portal
      - run: npm test
        working-directory: merchant-portal
      - run: npm run lint
        working-directory: merchant-portal
      - run: npm run build
        working-directory: merchant-portal

  customer-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: customer-app
      - run: dart format --set-exit-if-changed lib test
        working-directory: customer-app
      - run: flutter analyze
        working-directory: customer-app
      - run: flutter test
        working-directory: customer-app
      - name: Create ephemeral CI signing key
        working-directory: customer-app
        run: keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/customer-ci.jks" -storepass ci-only-password -keypass ci-only-password -alias customer-ci -dname "CN=CI,O=Delivery,C=PE" -keyalg RSA -keysize 2048 -validity 2
      - name: Create compile-only Firebase client configuration
        working-directory: customer-app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = {"project_info": {"project_number": "123456789012", "project_id": "delivery-ci"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef", "android_client_info": {"package_name": "com.delivery.platform.customer"}},
              "api_key": [{"current_key": "ci-placeholder-not-for-runtime"}]}], "configuration_version": "1"}
          Path('android/app/google-services.json').write_text(json.dumps(config))
          PY
      - name: Build signed release APK
        env:
          DELIVERY_ANDROID_STORE_FILE: ${{ runner.temp }}/customer-ci.jks
          DELIVERY_ANDROID_STORE_PASSWORD: ci-only-password
          DELIVERY_ANDROID_KEY_ALIAS: customer-ci
          DELIVERY_ANDROID_KEY_PASSWORD: ci-only-password
        run: flutter build apk --release --dart-define=ENVIRONMENT=staging --dart-define=API_BASE_URL=https://staging.invalid --dart-define=WS_BASE_URL=wss://staging.invalid
        working-directory: customer-app

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          ADMIN_DOMAIN: admin.example.com
          MERCHANT_DOMAIN: merchant.example.com
          API_DOMAIN: api.example.com
          MEDIA_DOMAIN: media.example.com
          ACME_EMAIL: ops@example.com
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-only-jwt-secret-that-is-longer-than-forty-eight-characters
          PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-longer-than-thirty-two
          MOBILE_TENANT_CODE: ci-test-tenant
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          MAIL_HOST: smtp.example.com
          MAIL_USERNAME: ci
          MAIL_PASSWORD: ci
          GOOGLE_MAPS_API_KEY: ci-only-placeholder-not-used-for-network-requests
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
